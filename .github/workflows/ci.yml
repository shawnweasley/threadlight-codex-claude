name: macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Verify signature
        run: codesign --verify --deep --strict build/Threadlight.app
      - name: Verify packaged artwork
        run: build/Threadlight.app/Contents/MacOS/Threadlight --check-assets
      - name: Build and verify DMG
        run: ./scripts/build-dmg.sh --skip-build
